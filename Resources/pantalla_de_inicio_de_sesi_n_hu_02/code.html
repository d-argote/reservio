<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Reservio - Iniciar Sesión</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#1a365d",
                        "on-tertiary-fixed": "#2b1700",
                        "on-tertiary-fixed-variant": "#633f0f",
                        "surface-variant": "#dfe3e7",
                        "surface-dim": "#d6dade",
                        "secondary-container": "#a5c8ff",
                        "surface-container-low": "#f0f4f8",
                        "surface-container-highest": "#dfe3e7",
                        "surface-tint": "#455f88",
                        "tertiary": "#321b00",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#adc7f7",
                        "on-tertiary-container": "#c6955e",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#001b3c",
                        "inverse-surface": "#2c3134",
                        "on-surface-variant": "#43474e",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#2d476f",
                        "surface": "#f6fafe",
                        "outline": "#74777f",
                        "outline-variant": "#c4c6cf",
                        "inverse-primary": "#adc7f7",
                        "on-surface": "#171c1f",
                        "inverse-on-surface": "#edf1f5",
                        "tertiary-container": "#4f2e00",
                        "surface-container": "#eaeef2",
                        "secondary-fixed": "#d4e3ff",
                        "on-secondary-fixed": "#001c3a",
                        "background": "#f6fafe",
                        "tertiary-fixed": "#ffddba",
                        "primary-fixed": "#d6e3ff",
                        "surface-bright": "#f6fafe",
                        "secondary": "#3b6090",
                        "surface-container-high": "#e4e9ed",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#f2bc82",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#a5c8ff",
                        "on-secondary-container": "#2e5484",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#204877",
                        "on-background": "#171c1f",
                        "on-primary-container": "#86a0cd",
                        "primary": "#002045"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface-container flex min-h-screen items-center justify-center p-4 antialiased">
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_24px_32px_-4px_rgba(23,28,31,0.06)] p-8 sm:p-10 flex flex-col relative z-10">
<div class="text-center mb-8">
<h1 class="text-2xl font-black text-primary tracking-widest uppercase mb-2">Reservio</h1>
<h2 class="text-xl font-semibold text-on-surface">Bienvenido a Reservio</h2>
</div>
<div class="bg-error-container text-on-error-container rounded-lg p-4 mb-8 flex items-start gap-3" role="alert">
<span class="material-symbols-outlined text-on-error-container mt-0.5" data-icon="error" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="text-sm font-medium">Credenciales incorrectas o Usuario no encontrado</p>
</div>
<form action="#" class="flex flex-col gap-6" method="POST">
<div class="flex flex-col gap-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-wide" for="email">Correo Electrónico</label>
<input class="w-full bg-surface-container-highest border-0 rounded-lg px-4 py-3 text-on-surface focus:ring-2 focus:ring-primary focus:outline-none transition-shadow placeholder:text-outline" id="email" name="email" placeholder="nombre@empresa.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-wide" for="password">Contraseña</label>
<input class="w-full bg-surface-container-highest border-0 rounded-lg px-4 py-3 text-on-surface focus:ring-2 focus:ring-primary focus:outline-none transition-shadow placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="flex justify-end mt-1">
<a class="text-sm font-medium text-secondary hover:text-primary transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-medium py-3.5 rounded-lg mt-2 hover:bg-primary-container transition-colors shadow-sm flex items-center justify-center gap-2" type="submit">
<span>Iniciar Sesión</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="text-center mt-10">
<p class="text-sm text-on-surface-variant">
                ¿No tienes cuenta? 
                <a class="font-semibold text-primary hover:text-secondary transition-colors" href="#">Regístrate aquí</a>
</p>
</div>
</main>
</body></html>
