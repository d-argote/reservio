<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#001529"/>

  <!-- Calendar body -->
  <rect x="6" y="10" width="20" height="16" rx="2.5" fill="none" stroke="#C9A84C" stroke-width="1.8"/>

  <!-- Calendar header band -->
  <rect x="6" y="10" width="20" height="6" rx="2.5" fill="#C9A84C"/>
  <rect x="6" y="13" width="20" height="3" fill="#C9A84C"/>

  <!-- Calendar hooks -->
  <line x1="11" y1="7.5" x2="11" y2="12.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="7.5" x2="21" y2="12.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Grid dots (days) -->
  <circle cx="11" cy="20" r="1.2" fill="#ffffff"/>
  <circle cx="16" cy="20" r="1.2" fill="#ffffff"/>
  <circle cx="21" cy="20" r="1.2" fill="#C9A84C"/>
  <circle cx="11" cy="24" r="1.2" fill="#ffffff"/>
  <circle cx="16" cy="24" r="1.2" fill="#ffffff"/>
  <circle cx="21" cy="24" r="1.2" fill="#ffffff"/>
</svg>
